name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # 두 번 연달아 올리면 앞의 배포가 취소되면서 '실패' 로 남습니다.
  # 줄을 세워 둘 다 끝내도록 합니다 (올린 것이 반영 안 되는 일을 막습니다).
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # 저장소 전체(.git 포함)를 올리면 50MB 가까이 돼서 업로드가 가끔 실패합니다.
      # 웹에 필요한 것만 따로 모아서 올립니다.
      - name: 올릴 파일만 모으기
        run: |
          mkdir -p _site
          rsync -a --exclude '.git' --exclude '.github' --exclude '_site' \
                --exclude '*.command' --exclude 'serve.py' ./ _site/
          du -sh _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
